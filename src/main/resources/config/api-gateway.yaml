server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: item-service
          uri: lb://item-service
          predicates:
            - Path=/api/v1/items/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway